server.port=${SERVER_PORT:8083}

spring.application.name=shortliner-payment

# Spring's default @Scheduled pool is a single thread shared by every
# scheduled method in the app. With independent jobs (OutboxPublisher,
# ReconciliationJob, OutboxBacklogMetrics), one blocking on a slow/unreachable
# Kafka broker would silently starve the others of ever running. Give each
# job its own thread.
spring.task.scheduling.pool.size=3

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.database-platform=${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Propagates the current trace context into Kafka record headers so
# downstream consumers (e.g. shortliner) can continue the trace.
spring.kafka.template.observation-enabled=true

# OAuth2 resource server (Keycloak realm "shortliner"). Deliberately NOT
# issuer-uri: that fetches discovery from keycloak.local at startup, which
# doesn't resolve from pods. The JWKS is fetched lazily on the first
# authenticated request, and iss is validated explicitly (SecurityConfig).
# In the cluster, KEYCLOAK_JWK_SET_URI points at the in-cluster service.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak.local/realms/shortliner/protocol/openid-connect/certs}
keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://keycloak.local/realms/shortliner}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Reconciliation: how often the sweep runs, and how long a payment must sit
# PENDING before it's considered stuck rather than just in-flight.
payment.reconciliation.interval-ms=${RECONCILIATION_INTERVAL_MS:30000}
payment.reconciliation.stuck-after-ms=${RECONCILIATION_STUCK_AFTER_MS:20000}

# Outbox publisher poll cadence and batch size.
payment.outbox.poll-interval-ms=${OUTBOX_POLL_INTERVAL_MS:2000}
payment.outbox.batch-size=${OUTBOX_BATCH_SIZE:50}
# How long one batch waits for Kafka acks before leaving unacked rows PENDING.
payment.outbox.send-timeout-ms=${OUTBOX_SEND_TIMEOUT_MS:10000}
# How often the outbox pending/age gauges re-read the table.
payment.outbox.metrics-refresh-ms=${OUTBOX_METRICS_REFRESH_MS:15000}

# Mock provider: simulated network latency and a configurable failure rate
# (0.0-1.0) so FAILED payments and the reconciliation path are both easy to
# trigger without real chaos engineering.
payment.provider.mock.min-latency-ms=${MOCK_PROVIDER_MIN_LATENCY_MS:50}
payment.provider.mock.max-latency-ms=${MOCK_PROVIDER_MAX_LATENCY_MS:200}
payment.provider.mock.failure-rate=${MOCK_PROVIDER_FAILURE_RATE:0.1}

# See DebugController — disable in any shared/production-like environment.
payment.debug.enabled=${PAYMENT_DEBUG_ENABLED:true}

management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Metrics (scraped by Prometheus)
management.endpoints.web.exposure.include=health,prometheus,metrics
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Distributed tracing (OpenTelemetry). Export is opt-in until a collector
# endpoint is available; toggle via OTEL_TRACING_EXPORT_ENABLED once one is.
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.tracing.export.enabled=${OTEL_TRACING_EXPORT_ENABLED:false}

logging.level.com.shortliner.payment=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.kafka=${LOG_LEVEL_KAFKA:INFO}

# Structured JSON logs (trace/span IDs are included automatically via MDC).
# Unset by default for readable local console output; set to "logstash" or
# "ecs" in environments with a log aggregator (e.g. Loki, ELK).
logging.structured.format.console=${LOGGING_STRUCTURED_FORMAT_CONSOLE:}
