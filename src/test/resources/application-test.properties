spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Unlike shortliner-analytics, KafkaAutoConfiguration is NOT excluded here:
# OutboxPublisher requires a real KafkaTemplate bean to even construct.
# The autoconfigured template doesn't connect until something actually
# sends, which no test here does outside PaymentConcurrencyIT (which mocks
# it instead).

# Keep the scheduled jobs from firing mid-test; tests trigger them directly.
payment.reconciliation.interval-ms=999999999
payment.outbox.poll-interval-ms=999999999
payment.outbox.metrics-refresh-ms=999999999

payment.provider.mock.min-latency-ms=0
payment.provider.mock.max-latency-ms=0
payment.provider.mock.failure-rate=0.0
